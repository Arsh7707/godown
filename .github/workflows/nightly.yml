# Every night (and on demand from the Actions tab): far longer random-history
# and fuzzing runs than on each push, each browser test twice to catch flaky
# ones, two Node versions, and the live site. A failure opens a GitHub issue
# (you get an email); it closes by itself once the night is green again.
name: Nightly

on:
  schedule:
    - cron: "30 21 * * *" # 3:00 am India
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculations:
    name: 300 random histories (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: All unit tests
        run: npm test
        env:
          PROPERTY_RUNS: 25
      - name: Deep random histories of orders, dispatches and stock
        run: npx vitest run tests/properties.test.ts
        env:
          PROPERTY_RUNS: 300

  browser:
    name: Browser tests ×2, deep fuzzing, strict accessibility report
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: godown_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/godown_e2e
      E2E_SAFARI: 1
      FUZZ_RUNS: 2000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium webkit
      - name: Every browser test twice (a test that fails only sometimes is a bug too)
        run: npx playwright test --repeat-each=2 --retries=0
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  live:
    name: Live site check (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live-smoke

  report:
    name: Open or close the issue
    needs: [calculations, browser, live]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const failed = ${{ contains(needs.*.result, 'failure') }};
            await require('./.github/scripts/failure-issue.cjs')({ github, context, failed, title: "Nightly checks failing" });
