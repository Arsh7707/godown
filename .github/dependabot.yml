# Weekly pull requests that update libraries; each one runs the full CI first,
# so you can see before merging whether the update breaks anything.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node's types follow the Node version the app runs on (22), not the newest Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 (the new Go compiler) isn't supported by the lint tooling yet; revisit when typescript-eslint supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
